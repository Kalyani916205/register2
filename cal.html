<html>
<head>
<title>calculator</title>
</head>
<body>
<input id="a" placeholder="enter a value"><br>
<input id="b" placeholder="enter b value"><br>

<button input onclick="result.value=Number(a.value)+Number(b.value)">+</button>
<br><br>
<button input onclick="result.value=Number(a.value)-Number(b.value)">-</button>
<br><br>
<button input onclick="result.value=Number(a.value)*Number(b.value)">*</button>
<br><br>
<button input onclick="result.value=Number(a.value)/Number(b.value)">/</button>
<br><br>

<input id="result" placehloder="Result">
</body>
</html>
